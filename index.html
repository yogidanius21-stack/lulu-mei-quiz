<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="测测你和对象是哪个版本的噜噜噜妹——情侣日常趣味人格测试" />
  <title>测测你和对象是哪个版本的噜噜噜妹</title>
  <style>
    :root {
      --cream: #FFF9E6;
      --yellow: #FFC857;
      --orange: #F4A261;
      --peach: #FFD1DC;
      --lavender: #E2D5F5;
      --sage: #C8E6C9;
      --warm-white: #FFFCF7;
      --brown: #4E342E;
      --brown-light: #7D5A50;
      --shadow: 0 8px 24px rgba(78, 52, 46, 0.10);
      --shadow-sm: 0 4px 12px rgba(78, 52, 46, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--cream);
      color: var(--brown);
      overflow-x: hidden;
    }

    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 24px 20px 48px;
      position: relative;
    }

    .screen {
      display: none;
      animation: fadeIn 0.45s ease both;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 装饰 */
    .deco {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    .deco.orange {
      top: -40px;
      right: -40px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, var(--orange) 0%, transparent 70%);
      border-radius: 50%;
    }

    .deco.peach {
      bottom: 60px;
      left: -50px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, var(--peach) 0%, transparent 70%);
      border-radius: 50%;
    }

    /* 首页 */
    .home-hero {
      text-align: center;
      margin-top: 12px;
    }

    .home-hero svg {
      max-width: 320px;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 12px 24px rgba(78, 52, 46, 0.12));
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.25;
      margin: 22px 0 10px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--brown-light);
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .tag {
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--warm-white);
      color: var(--brown-light);
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(244, 162, 97, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.2s ease, opacity 0.2s ease;
      box-shadow: var(--shadow);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--yellow) 0%, var(--orange) 100%);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .btn-secondary {
      background: var(--warm-white);
      color: var(--brown);
      border: 1px solid rgba(78, 52, 46, 0.12);
    }

    .hint {
      text-align: center;
      font-size: 13px;
      color: var(--brown-light);
      margin-top: 16px;
      line-height: 1.5;
    }

    .disclaimer {
      text-align: center;
      font-size: 11px;
      color: #9E9E9E;
      margin-top: 36px;
      line-height: 1.5;
    }

    /* 答题页 */
    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .quiz-back {
      font-size: 14px;
      color: var(--brown-light);
      background: transparent;
      border: none;
      padding: 6px 0;
      cursor: pointer;
    }

    .quiz-count {
      font-size: 14px;
      color: var(--brown-light);
      font-weight: 600;
    }

    .progress-wrap {
      height: 10px;
      background: rgba(244, 162, 97, 0.15);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--yellow), var(--orange));
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .question-card {
      background: var(--warm-white);
      border-radius: 26px;
      padding: 24px 22px 28px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .question-text {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.5;
      margin: 0 0 22px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 16px 18px;
      border-radius: 18px;
      background: #FFF;
      border: 2px solid transparent;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    }

    .option:active {
      transform: scale(0.98);
    }

    .option:hover {
      border-color: rgba(244, 162, 97, 0.35);
    }

    .option.selected {
      border-color: var(--orange);
      background: rgba(255, 200, 87, 0.12);
    }

    .option-marker {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(244, 162, 97, 0.15);
      color: var(--brown);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .option.selected .option-marker {
      background: var(--orange);
      color: #fff;
    }

    .option-text {
      font-size: 15px;
      line-height: 1.55;
      color: var(--brown);
    }

    .quiz-nav {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    /* 加载页 */
    .loading-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
    }

    .loading-box svg {
      width: 180px;
      height: 180px;
      animation: bounce 1.6s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    .loading-text {
      margin-top: 24px;
      font-size: 18px;
      font-weight: 700;
      color: var(--brown);
    }

    .loading-dots::after {
      content: "";
      animation: dots 1.4s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }

    /* 结果页 */
    .result-card {
      background: var(--warm-white);
      border-radius: 30px;
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .result-visual {
      background: linear-gradient(180deg, rgba(255, 209, 220, 0.35) 0%, rgba(255, 249, 230, 0.6) 100%);
      padding: 24px 20px 10px;
      text-align: center;
      position: relative;
    }

    .result-visual svg {
      width: 100%;
      max-width: 340px;
      height: auto;
      filter: drop-shadow(0 10px 20px rgba(78, 52, 46, 0.1));
    }

    .result-body {
      padding: 22px 24px 28px;
    }

    .result-type {
      font-size: 13px;
      font-weight: 700;
      color: var(--orange);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .result-title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.3;
      margin: 0 0 12px;
    }

    .result-keyword {
      display: inline-block;
      font-size: 14px;
      color: var(--brown-light);
      background: rgba(244, 162, 97, 0.1);
      padding: 8px 14px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    .result-section {
      margin-bottom: 16px;
    }

    .result-section h4 {
      font-size: 13px;
      color: var(--brown-light);
      margin: 0 0 6px;
      font-weight: 600;
    }

    .result-section p {
      font-size: 15px;
      line-height: 1.6;
      margin: 0;
    }

    .result-share-line {
      background: rgba(255, 200, 87, 0.15);
      border-radius: 16px;
      padding: 16px;
      margin: 20px 0 8px;
      font-size: 15px;
      font-weight: 700;
      color: var(--brown);
      text-align: center;
      border: 1px dashed rgba(244, 162, 97, 0.35);
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%) translateY(20px);
      background: var(--brown);
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (min-width: 600px) {
      #app {
        padding-top: 40px;
      }
      .title {
        font-size: 32px;
      }
    }
  </style>
</head>

  </div>

        eyes: `<g transform="translate(0,-60)"><ellipse cx="-35" cy="0" rx="14" ry="17" fill="#fff"/><circle cx="-35" cy="0" r="8" fill="#3E3E3E"/><circle cx="-32" cy="-4" r="3" fill="#fff"/><ellipse cx="35" cy="0" rx="14" ry="17" fill="#fff"/><circle cx="35" cy="0" r="8" fill="#3E3E3E"/><circle cx="38" cy="-4" r="3" fill="#fff"/></g>`,
        mouth: `<path d="M -10 24 L 10 24" stroke="#7D5A50" stroke-width="3" stroke-linecap="round"/>`,
        clothing: `<path d="M -80 18 Q 0 -8 80 18 L 88 82 Q 0 62 -88 82 Z" fill="#8D6E63"/>`,
        arms: `<path d="M -96 58 Q -120 88 -100 118" stroke="#FFC857" stroke-width="24" stroke-linecap="round" fill="none"/><path d="M 96 58 Q 118 85 95 112" stroke="#FFC857" stroke-width="24" stroke-linecap="round" fill="none"/><circle cx="-100" cy="118" r="15" fill="#FFC857"/><circle cx="95" cy="112" r="15" fill="#FFC857"/>`,
        prop: `<g transform="translate(-100,118) rotate(-20)"><circle cx="0" cy="0" r="22" fill="none" stroke="#8D6E63" stroke-width="4"/><line x1="14" y1="14" x2="34" y2="34" stroke="#8D6E63" stroke-width="5" stroke-linecap="round"/></g><g transform="translate(95,112)"><rect x="-14" y="-20" width="28" height="36" rx="3" fill="#FFF" stroke="#D7CCC8" stroke-width="2"/><rect x="-10" y="-14" width="20" height="2" fill="#BDBDBD"/><rect x="-10" y="-8" width="16" height="2" fill="#BDBDBD"/></g><path d="M -135 -110 Q -125 -100 -115 -110 Q -105 -100 -95 -110" stroke="#8D6E63" stroke-width="4" stroke-linecap="round" fill="none"/>`,
        bgDecor: `<g opacity="0.4"><ellipse cx="-120" cy="-130" rx="12" ry="7" fill="#8D6E63"/><ellipse cx="-100" cy="-120" rx="10" ry="6" fill="#8D6E63"/></g>`
      },
      foodie: {
        eyes: `<g transform="translate(0,-60)"><path d="M -50 0 Q -35 12 -20 0" stroke="#3E3E3E" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M 20 0 Q 35 12 50 0" stroke="#3E3E3E" stroke-width="4" fill="none" stroke-linecap="round"/></g>`,
        mouth: `<path d="M -18 14 Q 0 34 18 14 Z" fill="#E57373" stroke="#7D5A50" stroke-width="3" stroke-linejoin="round"/>`,
        clothing: `<path d="M -78 20 Q 0 -2 78 20 L 84 78 Q 0 60 -84 78 Z" fill="#FFCC80"/><path d="M -40 30 Q 0 50 40 30" stroke="#FFF" stroke-width="4" fill="none" stroke-linecap="round"/>`,
        arms: `<path d="M -96 58 Q -115 90 -80 112" stroke="#FFC857" stroke-width="24" stroke-linecap="round" fill="none"/><path d="M 96 58 Q 115 90 80 112" stroke="#FFC857" stroke-width="24" stroke-linecap="round" fill="none"/><circle cx="-80" cy="112" r="15" fill="#FFC857"/><circle cx="80" cy="112" r="15" fill="#FFC857"/>`,
        prop: `<g transform="translate(0,110)"><path d="M -22 -28 L -18 18 L 18 18 L 22 -28 Z" fill="#D7CCC8" opacity="0.4"/><rect x="-20" y="-30" width="40" height="8" rx="3" fill="#FFF" stroke="#D7CCC8" stroke-width="2"/><rect x="-16" y="-22" width="32" height="36" rx="4" fill="#FFF" stroke="#D7CCC8" stroke-width="2"/><line x1="-16" y1="-14" x2="16" y2="-14" stroke="#D7CCC8" stroke-width="2"/><circle cx="-8" cy="-6" r="3" fill="#8D6E63"/><circle cx="6" cy="-2" r="3" fill="#8D6E63"/><circle cx="0" cy="6" r="3" fill="#8D6E63"/><circle cx="10" cy="10" r="3" fill="#8D6E63"/></g><g transform="translate(105,105)"><rect x="-14" y="-12" width="28" height="22" rx="4" fill="#FFF" stroke="#FFD1DC" stroke-width="2"/><path d="M -8 -6 Q 0 0 8 -6" stroke="#E57373" stroke-width="2" fill="none"/></g>`,
        bgDecor: `<g opacity="0.45"><circle cx="-130" cy="-120" r="8" fill="#FFCC80"/><circle cx="130" cy="-100" r="8" fill="#FFCC80"/></g>`
      },
      manager: {
        eyes: `<g transform="translate(0,-60)"><ellipse cx="-35" cy="0" rx="16" ry="20" fill="#fff"/><circle cx="-35" cy="0" r="9" fill="#3E3E3E"/><circle cx="-32" cy="-4" r="3" fill="#fff"/><ellipse cx="35" cy="0" rx="16" ry="20" fill="#fff"/><circle cx="35" cy="0" r="9" fill="#3E3E3E"/><circle cx="38" cy="-4" r="3" fill="#fff"/></g>`,
        mouth: `<path d="M -14 20 Q 0 27 14 20" stroke="#7D5A50" stroke-width="3" fill="none" stroke-linecap="round"/>`,
        clothing: `<path d="M -78 20 Q 0 -2 78 20 L 84 78 Q 0 60 -84 78 Z" fill="#A5D6A7"/><path d="M -35 25 Q 0 42 35 25" stroke="#FFF" stroke-width="4" fill="none" stroke-linecap="round"/>`,
        arms: `<path d="M -96 58 Q -122 88 -105 118" stroke="#FFC857" stroke-width="24" stroke-linecap="round" fill="none"/><path d="M 96 58 Q 120 88 90 115" stroke="#FFC857" stroke-width="24" stroke-linecap="round" fill="none"/><circle cx="-105" cy="118" r="15" fill="#FFC857"/><circle cx="90" cy="115" r="15" fill="#FFC857"/>`,
        prop: `<g transform="translate(-105,118) rotate(-15)"><path d="M -28 -35 Q 0 -55 28 -35 L 24 50 Q 0 60 -24 50 Z" fill="#FFF9C4" stroke="#D7CCC8" stroke-width="2"/><line x1="0" y1="-45" x2="0" y2="50" stroke="#D7CCC8" stroke-width="2"/></g><g transform="translate(90,115)"><rect x="-14" y="-18" width="28" height="34" rx="4" fill="#FFF" stroke="#A5D6A7" stroke-width="2"/><rect x="-10" y="-12" width="20" height="2" fill="#BDBDBD"/><rect x="-10" y="-6" width="16" height="2" fill="#BDBDBD"/><rect x="-10" y="0" width="18" height="2" fill="#BDBDBD"/></g>`,
        bgDecor: `<g opacity="0.45"><path d="M -120 -130 Q -100 -150 -80 -130 L -80 -120 L -120 -120 Z" fill="#A5D6A7"/><path d="M 110 -120 L 120 -120 L 125 -110 L 115 -110 Z" fill="#A5D6A7"/></g>`
      }
    };

    function renderCharacter(role, type, transform) {
      const v = TYPE_VISUALS[type] || TYPE_VISUALS.sunny;
      const skin = "#FFC857";
      const shadow = "#F4A261";
      const isLumei = role === "lumei";
      return `<g transform="${transform}">
        ${v.bgDecor || ""}
        <ellipse cx="0" cy="70" rx="96" ry="89" fill="${skin}" />
        <ellipse cx="0" cy="70" rx="96" ry="89" fill="url(#bodyGrad)" opacity="0.35" />
        ${isLumei
          ? `<path d="M -86 126 Q 0 182 86 126 L 66 64 Q 0 84 -66 64 Z" fill="#FFD1DC"/>`
          : `<path d="M -88 126 Q 0 178 88 126 L 78 94 Q 0 114 -78 94 Z" fill="#D98E48"/>`}
        <ellipse cx="0" cy="-40" rx="116" ry="101" fill="${skin}" />
        <ellipse cx="-82" cy="-102" rx="24" ry="20" fill="${skin}" />
        <ellipse cx="82" cy="-102" rx="24" ry="20" fill="${skin}" />
        <ellipse cx="0" cy="-5" rx="77" ry="59" fill="${shadow}" opacity="0.55" />
        <ellipse cx="0" cy="-26" rx="19" ry="13" fill="#A67C52" />
        ${v.eyes}
        ${v.mouth}
        <circle cx="-72" cy="-28" r="13" fill="#FFB7C5" opacity="0.55" />
        <circle cx="72" cy="-28" r="13" fill="#FFB7C5" opacity="0.55" />
        ${isLumei ? lumeiBonnet() : luluBun()}
        ${v.clothing || ""}
        ${v.arms || DEFAULT_ARMS}
        ${v.prop || ""}
      </g>`;
    }

    function renderHero() {
      const content = `
        <rect x="0" y="0" width="520" height="360" fill="none" />
        ${renderCharacter("lumei", "sunny", "translate(170,180) scale(0.85)")}
        ${renderCharacter("lulu", "boss", "translate(350,190) scale(0.9)")}
        <g opacity="0.5"><path d="M 240 120 C 250 105 270 105 280 120 C 290 105 310 105 320 120" stroke="#FF8A80" stroke-width="4" fill="none" stroke-linecap="round"/></g>
      `;
      return svgWrapper("0 0 520 360", content);
    }

    function renderLoading() {
      const content = renderCharacter("lulu", "sunny", "translate(200,200) scale(1)");
      return svgWrapper("0 0 400 400", content);
    }

    function renderResultVisual(variant, primaryType, secondaryType) {
      if (variant === "couple") {
        const leftType = secondaryType || primaryType;
        const content = `
          <rect x="0" y="0" width="400" height="360" fill="none" />
          ${renderCharacter("lulu", primaryType, "translate(125,190) scale(0.82)")}
          ${renderCharacter("lumei", leftType, "translate(280,195) scale(0.78)")}
          <g opacity="0.5"><path d="M 185 110 C 195 95 215 95 225 110" stroke="#FF8A80" stroke-width="4" fill="none" stroke-linecap="round"/></g>
        `;
        return svgWrapper("0 0 400 360", content);
      }
      const t = variant === "lumei" ? "lumei" : "lulu";
      const content = renderCharacter(t, primaryType, "translate(200,200) scale(1)");
      return svgWrapper("0 0 400 400", content);
    }

    /* =========================================================
       逻辑层：状态管理与页面切换
       ========================================================= */

    let currentQuestion = 0;
    const answers = new Array(QUESTIONS.length).fill(null);

    const screens = {
      home: document.getElementById("home"),
      quiz: document.getElementById("quiz"),
      loading: document.getElementById("loading"),
      result: document.getElementById("result")
    };

    function showScreen(name) {
      Object.values(screens).forEach(s => s.classList.remove("active"));
      screens[name].classList.add("active");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function shuffleArray(array) {
      const a = array.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 每道题渲染时都会重新打乱选项顺序，避免 A/B/C/D 固定对应某一类型
    const shuffledQuestions = QUESTIONS.map(q => ({
      ...q,
      options: shuffleArray(q.options)
    }));

    function renderQuestion() {
      const q = shuffledQuestions[currentQuestion];
      document.getElementById("quizCount").textContent = `${currentQuestion + 1} / ${shuffledQuestions.length}`;
      document.getElementById("progressBar").style.width = `${((currentQuestion + 1) / shuffledQuestions.length) * 100}%`;
      document.getElementById("questionText").textContent = q.question;

      const box = document.getElementById("optionsBox");
      box.innerHTML = "";
      const markers = ["A", "B", "C", "D"];
      q.options.forEach((opt, idx) => {
        const el = document.createElement("div");
        el.className = "option";
        if (answers[currentQuestion] === idx) el.classList.add("selected");
        el.innerHTML = `<span class="option-marker">${markers[idx]}</span><span class="option-text">${opt.text}</span>`;
        el.addEventListener("click", () => selectOption(idx));
        box.appendChild(el);
      });

      const prevBtn = document.getElementById("prevBtn");
      prevBtn.style.visibility = currentQuestion === 0 ? "hidden" : "visible";
      document.getElementById("nextBtn").disabled = answers[currentQuestion] === null;
    }

    function selectOption(idx) {
      answers[currentQuestion] = idx;
      renderQuestion();
      setTimeout(() => {
        if (currentQuestion < shuffledQuestions.length - 1) {
          currentQuestion++;
          renderQuestion();
        } else {
          finishQuiz();
        }
      }, 280);
    }

    function finishQuiz() {
      showScreen("loading");
      document.getElementById("loadingBox").innerHTML = renderLoading() + `<div class="loading-text">正在分析你的噜噜属性<span class="loading-dots"></span></div>`;
      setTimeout(() => {
        renderResult();
        showScreen("result");
      }, 1500);
    }

    function calculateScores() {
      const scores = {};
      TYPE_ORDER.forEach(t => scores[t] = 0);
      answers.forEach((ansIdx, qIdx) => {
        if (ansIdx === null) return;
        const type = shuffledQuestions[qIdx].options[ansIdx].type;
        if (scores[type] !== undefined) scores[type]++;
      });
      return Object.entries(scores).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    }

    function getCombo(types) {
      if (types.length === 2) {
        const key = [...types].sort().join("+");
        return COMBOS[key] || {
          name: `${RESULT_TYPES[types[0]].label}×${RESULT_TYPES[types[1]].label}组合`,
          tag: "两种属性在你身上奇妙共存。",
          eye: "一个复杂但可爱的人",
          relation: "互补又合拍",
          share: "和你在一起的每一天都像开盲盒。"
        };
      }
      return {
        name: `${types.map(t => RESULT_TYPES[t].label).join("+")}`,
        tag: "三种属性在你身上同时营业。",
        eye: "一个丰富又可爱的存在",
        relation: "每天都不一样，但都很可爱",
        share: "我有好几种可爱，你慢慢发现。"
      };
    }

    function computeResult() {
      const sorted = calculateScores();
      const primary = { type: sorted[0][0], score: sorted[0][1] };
      const secondary = { type: sorted[1][0], score: sorted[1][1] };
      const tertiary = { type: sorted[2][0], score: sorted[2][1] };

      const tiePrimary = primary.score === secondary.score;
      const tieTriple = tiePrimary && secondary.score === tertiary.score;

      let mode = "single";
      let combo = null;
      let activeTypes = [primary.type];

      if (tieTriple) {
        mode = "triple";
        combo = getCombo([primary.type, secondary.type, tertiary.type]);
        activeTypes = [primary.type, secondary.type, tertiary.type];
      } else if (tiePrimary) {
        mode = "pair";
        combo = getCombo([primary.type, secondary.type]);
        activeTypes = [primary.type, secondary.type];
      } else if (secondary.score >= primary.score - 1) {
        mode = "pair";
        combo = getCombo([primary.type, secondary.type]);
        activeTypes = [primary.type, secondary.type];
      }

      return { primary, secondary, tertiary, mode, combo, activeTypes };
    }

    function randomVariant(mode) {
      if (mode === "pair" || mode === "triple") return "couple";
      const r = Math.random();
      if (r < 0.34) return "lulu";
      if (r < 0.67) return "lumei";
      return "couple";
    }

    let currentResultText = "";

    function renderResult() {
      const r = computeResult();
      const variant = randomVariant(r.mode);
      const primaryInfo = RESULT_TYPES[r.primary.type];
      const secondaryInfo = RESULT_TYPES[r.secondary.type];
      const tertiaryInfo = RESULT_TYPES[r.tertiary.type];

      let title, typeLabel;
      if (r.mode === "single") {
        const suffix = variant === "lulu" ? "噜噜" : variant === "lumei" ? "噜妹" : "噜噜噜妹";
        title = `你是：${primaryInfo.label}型${suffix}`;
        typeLabel = primaryInfo.label;
      } else {
        title = `你们是：${r.combo.name}型噜噜噜妹`;
        typeLabel = r.combo.name;
      }

      const visualType = r.mode === "single" ? r.primary.type : r.primary.type;
      const secondaryVisualType = r.mode === "single" ? r.primary.type : r.secondary.type;

      const cardHTML = `
        <div class="result-visual">
          ${renderResultVisual(variant, visualType, secondaryVisualType)}
        </div>
        <div class="result-body">
          <div class="result-type">${typeLabel}</div>
          <h2 class="result-title">${title}</h2>
          <div class="result-keyword">${r.mode === "single" ? primaryInfo.keyword : r.combo.tag}</div>

          <div class="result-section">
            <h4>你的恋爱关键词</h4>
            <p>${r.mode === "single" ? primaryInfo.keyword : `${primaryInfo.keyword} + ${secondaryInfo.keyword}`}</p>
          </div>

          <div class="result-section">
            <h4>你的专属恋爱场景</h4>
            <p>${primaryInfo.scene}</p>
          </div>

          <div class="result-section">
            <h4>你的反差萌点</h4>
            <p>${primaryInfo.contrast}</p>
          </div>

          <div class="result-section">
            <h4>你的主属性</h4>
            <p>${primaryInfo.label}：${primaryInfo.desc}</p>
          </div>

          ${r.mode !== "single" ? `
          <div class="result-section">
            <h4>你的副属性</h4>
            <p>${secondaryInfo.label}：${secondaryInfo.desc}</p>
          </div>` : ""}

          <div class="result-section">
            <h4>你的隐藏属性</h4>
            <p>${tertiaryInfo.label}：${tertiaryInfo.keyword}。${tertiaryInfo.desc}</p>
          </div>

          <div class="result-section">
            <h4>给对象的小建议</h4>
            <p>${primaryInfo.advice}</p>
          </div>

          <div class="result-section">
            <h4>你在对象眼里可能是</h4>
            <p>${r.mode === "single" ? primaryInfo.inEyes : r.combo.eye}</p>
          </div>

          <div class="result-section">
            <h4>你们的相处模式</h4>
            <p>${r.mode === "single" ? primaryInfo.pattern : r.combo.relation}</p>
          </div>

          <div class="result-section">
            <h4>你们的日常画风</h4>
            <p>${r.mode === "single" ? primaryInfo.daily : `${primaryInfo.daily} 同时也有 ${secondaryInfo.daily}`}</p>
          </div>

          <div class="result-share-line">${r.mode === "single" ? primaryInfo.shareLine : r.combo.share}</div>
        </div>
      `;

      document.getElementById("resultCard").innerHTML = cardHTML;

      currentResultText = `【测测你和对象是哪个版本的噜噜噜妹】\n${title}\n关键词：${r.mode === "single" ? primaryInfo.keyword : `${primaryInfo.keyword} + ${secondaryInfo.keyword}`}\n主属性：${primaryInfo.label}\n隐藏属性：${tertiaryInfo.label}\n相处模式：${r.mode === "single" ? primaryInfo.pattern : r.combo.relation}\n${r.mode === "single" ? primaryInfo.shareLine : r.combo.share}\n\n趣味测试仅供娱乐，结果不代表真实人格。`;
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    async function copyResult() {
      try {
        await navigator.clipboard.writeText(currentResultText);
        showToast("结果文案已复制");
      } catch (e) {
        showToast("复制失败，请手动截图分享");
      }
    }

    async function shareResult() {
      const payload = {
        title: "测测你和对象是哪个版本的噜噜噜妹",
        text: currentResultText,
        url: location.href
      };
      if (navigator.share) {
        try {
          await navigator.share(payload);
        } catch (e) {
          if (e.name !== "AbortError") copyResult();
        }
      } else {
        copyResult();
      }
    }

    function restart() {
      currentQuestion = 0;
      answers.fill(null);
      // 重新打乱题目选项
      shuffledQuestions.forEach((q, i) => {
        q.options = shuffleArray(QUESTIONS[i].options);
      });
      showScreen("home");
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      showScreen("quiz");
      renderQuestion();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (answers[currentQuestion] === null) return;
      if (currentQuestion < shuffledQuestions.length - 1) {
        currentQuestion++;
        renderQuestion();
      } else {
        finishQuiz();
      }
    });

    document.getElementById("copyBtn").addEventListener("click", copyResult);
    document.getElementById("shareBtn").addEventListener("click", shareResult);
    document.getElementById("restartBtn").addEventListener("click", restart);

    document.getElementById("homeHero").innerHTML = renderHero();
  </script>
</body>
</html>
